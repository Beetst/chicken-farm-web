<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>จัดการประกาศ - ตลาดไก่ชน</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <h1>🐓 จัดการประกาศ (เจ้าของฟาร์ม)</h1>
      <p>ลงประกาศไก่ชนใหม่ และดูข้อเสนอราคาที่เข้ามา</p>
    </div>
  </header>

  <main class="container">
    <section class="post-form-section">
      <h2>ลงประกาศไก่ชนใหม่</h2>
      <form id="post-form">
        <div class="form-row">
          <label for="name">ชื่อ/สายพันธุ์ไก่</label>
          <input type="text" id="name" required placeholder="เช่น ไก่เหลืองหางขาว">
        </div>
        <div class="form-row">
          <label for="price">ราคาเริ่มต้น (บาท)</label>
          <input type="number" id="price" required min="0" placeholder="เช่น 3000">
        </div>
        <div class="form-row">
          <label for="location">พื้นที่</label>
          <input type="text" id="location" placeholder="เช่น นครราชสีมา">
        </div>
        <div class="form-row">
          <label for="contact">ช่องทางติดต่อ</label>
          <input type="text" id="contact" required placeholder="เบอร์โทร / Line ID">
        </div>
        <div class="form-row">
          <label for="detail">รายละเอียดเพิ่มเติม</label>
          <textarea id="detail" rows="3" placeholder="อายุ น้ำหนัก ประวัติการชน ฯลฯ"></textarea>
        </div>
        <div class="form-row">
          <label for="image">รูปภาพ (URL)</label>
          <input type="text" id="image" placeholder="วางลิงก์รูปภาพ (ไม่บังคับ)">
        </div>
        <button type="submit">ลงประกาศ</button>
      </form>
    </section>

    <section class="listing-section">
      <div class="listing-header">
        <h2>ประกาศทั้งหมด (จัดการ)</h2>
        <input type="text" id="search" placeholder="ค้นหาชื่อไก่หรือพื้นที่...">
      </div>
      <div id="listings" class="listings-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p><a href="index.html" style="color:#8b3a2f;">&larr; กลับไปหน้าเว็บลูกค้า</a></p>
    </div>
  </footer>

  <div id="offer-modal" class="modal hidden">
    <div class="modal-content">
      <button class="modal-close" id="modal-close">&times;</button>
      <h3 id="modal-title"></h3>
      <div id="modal-offers"></div>
      <button id="delete-listing" type="button" style="background:#a33;margin-top:10px;">ลบประกาศนี้</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
